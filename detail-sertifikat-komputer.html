<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat Komputer | DEVA ARDITIA SUWITKA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      color: #f4f7ff;
      background: #070b16;
      font-family: Arial, sans-serif;
    }
    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #8ee7ff;
      text-decoration: none;
    }
    .detail {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(0, 1.2fr);
      gap: 36px;
      align-items: start;
    }
    .description {
      padding: 28px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .description .eyebrow {
      color: #8ee7ff;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 12px;
    }
    h1 { line-height: 1.2; }
    .description p { color: #b9c4d8; line-height: 1.8; }
    .certificate {
      padding: 12px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .certificate img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
    }
    @media (max-width: 760px) {
      body { padding: 18px; }
      .detail { grid-template-columns: 1fr; gap: 20px; }
      .description { padding: 22px; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html#portfolio">← Kembali ke Portofolio</a>
  <main class="detail">
    <section class="description">
      <div class="eyebrow">Dokumen Portofolio</div>
      <h1>Sertifikat Komputer</h1>
      <p>Sertifikat komputer yang saya miliki sebagai dokumentasi pembelajaran dan pengembangan kemampuan saya.</p>
    </section>
    <div class="certificate">
      <img src="sertifikat-komputer.jpg" alt="Sertifikat Komputer">
    </div>
  </main>







<style id="deva-cinematic-detail-style">
html { background: #050816; }
body { overflow-x: hidden; }
#deva-cinematic-curtain {
  position: fixed;
  inset: 0;
  z-index: 999999;
  pointer-events: none;
  background: radial-gradient(circle at center, #172554, #030712 72%);
  animation: curtain-out .85s cubic-bezier(.7,0,.2,1) forwards;
}
@keyframes curtain-out {
  from { opacity: 1; clip-path: inset(0 0 0 0); }
  to { opacity: 0; clip-path: inset(0 0 0 100%); }
}

/* Jendela UI muncul bergantian */
body > *:not(script):not(style) {
  opacity: 0;
  transform: translateY(28px) scale(.96);
  animation: window-arrive .8s cubic-bezier(.16,1,.3,1) forwards;
}
body > *:nth-child(1) { animation-delay: .15s; }
body > *:nth-child(2) { animation-delay: .35s; }
body > *:nth-child(3) { animation-delay: .55s; }
body > *:nth-child(4) { animation-delay: .75s; }

@keyframes window-arrive {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Dokumen meledak lembut dari tengah */
body img {
  opacity: 0;
  transform: scale(.12) rotate(-12deg);
  transform-origin: center center;
  animation: document-burst 1.25s cubic-bezier(.16,1.35,.3,1) .7s forwards;
  filter: drop-shadow(0 0 0 rgba(56,189,248,0));
}
@keyframes document-burst {
  0% {
    opacity: 0;
    transform: scale(.12) rotate(-12deg);
    filter: drop-shadow(0 0 0 rgba(56,189,248,0));
  }
  55% {
    opacity: 1;
    transform: scale(1.06) rotate(2deg);
    filter: drop-shadow(0 0 45px rgba(56,189,248,.65));
  }
  75% { transform: scale(.97) rotate(-1deg); }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
    filter: drop-shadow(0 18px 45px rgba(0,0,0,.4));
  }
}

/* Deskripsi diketik */
.deva-typewriter {
  overflow: hidden;
  white-space: normal;
  width: 0;
  max-width: 100%;
  animation: type-description 2.4s steps(42,end) 1.1s forwards;
}
@keyframes type-description {
  to { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>


<script id="deva-cinematic-detail-script">
(() => {
  const curtain = document.createElement("div");
  curtain.id = "deva-cinematic-curtain";
  curtain.setAttribute("aria-hidden", "true");
  document.body.appendChild(curtain);
  curtain.addEventListener("animationend", () => curtain.remove(), { once: true });

  const images = document.querySelectorAll("body img");
  images.forEach(img => img.classList.add("deva-document-burst"));

  const description = [...document.querySelectorAll("p")]
    .find(p => p.textContent.trim().length > 15);
  if (description) description.classList.add("deva-typewriter");
})();
</script>

</body>
</html>
