<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat Komputer | DEVA ARDITIA SUWITKA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      color: #f4f7ff;
      background: #070b16;
      font-family: Arial, sans-serif;
    }
    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #8ee7ff;
      text-decoration: none;
    }
    .detail {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(0, 1.2fr);
      gap: 36px;
      align-items: start;
    }
    .description {
      padding: 28px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .description .eyebrow {
      color: #8ee7ff;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 12px;
    }
    h1 { line-height: 1.2; }
    .description p { color: #b9c4d8; line-height: 1.8; }
    .certificate {
      padding: 12px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .certificate img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
    }
    @media (max-width: 760px) {
      body { padding: 18px; }
      .detail { grid-template-columns: 1fr; gap: 20px; }
      .description { padding: 22px; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html#portfolio">← Kembali ke Portofolio</a>
  <main class="detail">
    <section class="description">
      <div class="eyebrow">Dokumen Portofolio</div>
      <h1>Sertifikat Komputer</h1>
      <p>Sertifikat komputer yang saya miliki sebagai dokumentasi pembelajaran dan pengembangan kemampuan saya.</p>
    </section>
    <div class="certificate">
      <img src="20261103_003722.jpg" alt="Sertifikat Komputer">
    </div>
  </main>
















<script id="deva-cinematic-detail-script">
(() => {
  const curtain = document.createElement("div");
  curtain.id = "deva-cinematic-curtain";
  curtain.setAttribute("aria-hidden", "true");
  document.body.appendChild(curtain);
  curtain.addEventListener("animationend", () => curtain.remove(), { once: true });
})();
</script>


<style id="deva-certificate-fixed-animation">
/* Jendela deskripsi masuk dari kiri */
.detail .description {
  opacity: 0;
  transform: translateX(-90px) scale(.94);
  filter: blur(12px);
  animation: deva-description-window 1s cubic-bezier(.16,1,.3,1) .25s forwards;
}

@keyframes deva-description-window {
  to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
}

/* Jendela dokumen masuk dari kanan */
.detail .certificate {
  opacity: 0;
  transform: translateX(90px) scale(.88);
  filter: blur(12px);
  animation: deva-certificate-window 1s cubic-bezier(.16,1,.3,1) .45s forwards;
}

@keyframes deva-certificate-window {
  to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
}

/* Dokumen meledak lembut dari tengah */
.detail .certificate img {
  transform-origin: center;
  animation: deva-document-burst 1.25s cubic-bezier(.16,1.35,.3,1) 1s both;
}

@keyframes deva-document-burst {
  0% { opacity: 0; transform: scale(.08) rotate(-12deg); filter: brightness(2.5) drop-shadow(0 0 0 #38bdf8); }
  55% { opacity: 1; transform: scale(1.07) rotate(2deg); filter: brightness(1.25) drop-shadow(0 0 40px #38bdf8aa); }
  78% { transform: scale(.97) rotate(-1deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); filter: brightness(1) drop-shadow(0 18px 35px #0008); }
}

/* Efek mengetik deskripsi */
.detail .description p {
  clip-path: inset(0 100% 0 0);
  animation: deva-description-type 2.6s steps(55, end) 1.5s forwards;
}

@keyframes deva-description-type {
  to { clip-path: inset(0 0 0 0); }
}

@media (prefers-reduced-motion: reduce) {
  .detail .description,
  .detail .certificate,
  .detail .certificate img,
  .detail .description p {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
    clip-path: none !important;
  }
}
</style>

</body>
</html>
