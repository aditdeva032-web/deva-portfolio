<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat Kompetensi | DEVA ARDITIA SUWITKA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      color: #f4f7ff;
      background: #070b16;
      font-family: Arial, sans-serif;
    }
    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #8ee7ff;
      text-decoration: none;
    }
    .detail {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(0, 1.2fr);
      gap: 36px;
      align-items: start;
    }
    .description {
      padding: 28px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .description .eyebrow {
      color: #8ee7ff;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 12px;
    }
    h1 { line-height: 1.2; }
    .description p { color: #b9c4d8; line-height: 1.8; }
    .certificate {
      padding: 12px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .certificate img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
    }
    @media (max-width: 760px) {
      body { padding: 18px; }
      .detail { grid-template-columns: 1fr; gap: 20px; }
      .description { padding: 22px; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html#portfolio">← Kembali ke Portofolio</a>
  <main class="detail">
    <section class="description">
      <div class="eyebrow">Dokumen Portofolio</div>
      <h1>Sertifikat Kompetensi</h1>
      <p>Sertifikat kompetensi yang menjadi bagian dari perjalanan belajar dan pengembangan diri saya.</p>
    </section>
    <div class="certificate">
      <img src="sertifikat-kompetensi.jpg" alt="Sertifikat Kompetensi">
    </div>
  </main>













<style id="deva-cinematic-detail-style">
#deva-cinematic-curtain {
  position: fixed;
  inset: 0;
  z-index: 999999;
  pointer-events: none;
  background: radial-gradient(circle at center, #172554, #030712 72%);
  animation: deva-curtain-out .9s cubic-bezier(.7,0,.2,1) forwards;
}
@keyframes deva-curtain-out {
  from { opacity: 1; clip-path: inset(0); }
  to { opacity: 0; clip-path: inset(0 0 0 100%); }
}

/* Jendela deskripsi masuk dari kiri */
body .certificate-info,
body .certificate-content,
body .detail-info,
body main p {
  animation: deva-window-left .9s cubic-bezier(.16,1,.3,1) .35s both;
}
@keyframes deva-window-left {
  from { opacity: 0; transform: translateX(-70px) scale(.94); filter: blur(12px); }
  to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
}

/* Dokumen muncul dari tengah dengan efek burst */
body .certificate img,
body .certificate-content img,
body .detail-image img,
body main img {
  animation: deva-document-burst 1.3s cubic-bezier(.16,1.35,.3,1) .65s both;
  transform-origin: center;
}
@keyframes deva-document-burst {
  0% { opacity: 0; transform: scale(.08) rotate(-14deg); filter: brightness(2.5) drop-shadow(0 0 0 #38bdf8); }
  55% { opacity: 1; transform: scale(1.08) rotate(3deg); filter: brightness(1.3) drop-shadow(0 0 40px #38bdf8aa); }
  78% { transform: scale(.96) rotate(-1deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); filter: brightness(1) drop-shadow(0 18px 35px #0008); }
}

/* Efek ketik pada deskripsi */
body main p,
body .certificate-info p,
body .certificate-content p,
body .detail-info p {
  clip-path: inset(0 100% 0 0);
  animation: deva-typewriter-reveal 2.5s steps(45,end) 1.1s forwards;
}
@keyframes deva-typewriter-reveal {
  to { clip-path: inset(0 0 0 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; }
}
</style>


<script id="deva-cinematic-detail-script">
(() => {
  const curtain = document.createElement("div");
  curtain.id = "deva-cinematic-curtain";
  curtain.setAttribute("aria-hidden", "true");
  document.body.appendChild(curtain);
  curtain.addEventListener("animationend", () => curtain.remove(), { once: true });
})();
</script>

</body>
</html>
