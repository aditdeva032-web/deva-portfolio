<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sertifikat Kompetensi | DEVA ARDITIA SUWITKA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      color: #f4f7ff;
      background: #070b16;
      font-family: Arial, sans-serif;
    }
    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #8ee7ff;
      text-decoration: none;
    }
    .detail {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(0, 1.2fr);
      gap: 36px;
      align-items: start;
    }
    .description {
      padding: 28px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .description .eyebrow {
      color: #8ee7ff;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 12px;
    }
    h1 { line-height: 1.2; }
    .description p { color: #b9c4d8; line-height: 1.8; }
    .certificate {
      padding: 12px;
      border: 1px solid rgba(130,180,255,.2);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
    }
    .certificate img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
    }
    @media (max-width: 760px) {
      body { padding: 18px; }
      .detail { grid-template-columns: 1fr; gap: 20px; }
      .description { padding: 22px; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html#portfolio">← Kembali ke Portofolio</a>
  <main class="detail">
    <section class="description">
      <div class="eyebrow">Dokumen Portofolio</div>
      <h1>Sertifikat Kompetensi</h1>
      <p>Sertifikat kompetensi yang menjadi bagian dari perjalanan belajar dan pengembangan diri saya.</p>
    </section>
    <div class="certificate">
      <img src="sertifikat-kompetensi.jpg" alt="Sertifikat Kompetensi">
    </div>
  </main>
</body>
</html>
